server {
    listen 80;
    server_name aizashchita.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name aizashchita.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    ssl_certificate /etc/letsencrypt/live/aizashchita.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aizashchita.ru/privkey.pem;

    # Payload Admin is served only from admin.aizashchita.ru.
    location = /admin {
        return 404;
    }

    location ^~ /admin/ {
        return 404;
    }

    # Do not expose the administrative auth collection on the public host.
    location = /api/admin_users {
        return 404;
    }

    location ^~ /api/admin_users/ {
        return 404;
    }

    location / {
        proxy_pass http://192.168.122.82:3000;

        proxy_http_version 1.1;

        # WebSocket поддержка (если Payload/Admin использует)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Передаем реальные данные клиента
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Таймауты для долгих запросов
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
